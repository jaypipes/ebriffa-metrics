name: Generate community metrics report
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Source code repository'
        required: true
        type: string
        default: temporalio/temporal-worker-controller
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        type: string
  schedule:
    - cron: "3 2 1 * *" # 02:03 UTC on the 1st of every month

permissions:
  contents: read

jobs:
  build:
    name: community metrics
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    env:
      REPOSITORY: ${{ github.event.inputs.repository }}

    steps:
      - name: Validate Date Range
        run: |
          # Default to last month's date range...
          if [[ "z$START_DATE" = "z" ]]; then
            echo "defaulting to last month date range..."
            START_DATE=$(date -d "last month" +%Y-%m-01)
            END_DATE=$(date -d "$first_day +1 month -1 day" +%Y-%m-%d)
          fi
          if [[ "$START_DATE" > "$END_DATE" ]]; then
            echo "Error: Start date must be before end date."
            exit 1
          fi
            # Save to env in order to pass from one GH action step to next...
          echo "DATE_RANGE=$START_DATE..$END_DATE" >> $GITHUB_ENV
          echo "START_DATE=$START_DATE" >> $GITHUB_ENV
          echo "END_DATE=$END_DATE" >> $GITHUB_ENV
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/scripts
          sparse-checkout-cone-mode: false

      # Step 1: new-contributor identification (contributors.md)
      - name: Run contributors action
        uses: github-community-projects/contributors@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILENAME: contributors.md

      # Step 2a: issue response/close time (issue_metrics.md)
      - name: Run issue-metrics for issues
        uses: github-community-projects/issue-metrics@v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEARCH_QUERY: 'repo:${{ env.REPOSITORY }} is:issue created:${{ env.DATE_RANGE }} -reason:"not planned"'
          OUTPUT_FILE: issue_metrics.md

      # Step 2b: PR close/merge time (pr_metrics.md)
      - name: Run issue-metrics for PRs
        uses: github-community-projects/issue-metrics@v4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEARCH_QUERY: 'repo:${{ env.REPOSITORY }} is:pr created:${{ env.DATE_RANGE }}'
          OUTPUT_FILE: pr_metrics.md

      # Step 3: staleness buckets, new-vs-existing counts, issue->PR merge time
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install script dependencies
        run: pip install requests

      - name: Run custom metrics script
        env:
          REPOSITORY: ${{ env.REPOSITORY }}
          START_DATE: ${{ env.START_DATE }}
          END_DATE: ${{ env.END_DATE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STALE_THRESHOLDS: "3,7,14,30"
          CUSTOM_METRICS_OUTPUT: custom_metrics.md
        run: python .github/workflows/scripts/custom_metrics.py

      # Step 4: merge everything into one report
      - name: Combine reports
        run: |
          sed -i '0,/^# Contributors/s//## Contributors (by commit activity)/' contributors.md
          sed -i '0,/^# Issue Metrics/s//## Issue metrics — issues/' issue_metrics.md
          sed -i '0,/^# Issue Metrics/s//## Issue metrics — pull requests/' pr_metrics.md

          {
            echo "# Community metrics report"
            echo ""
            echo "## Repository: ${{ env.REPOSITORY }}"
            echo ""
            echo "Window: ${{ env.START_DATE }} to ${{ env.END_DATE }}"
            echo ""
            cat contributors.md
            echo ""
            cat issue_metrics.md
            echo ""
            cat pr_metrics.md
            echo ""
            cat custom_metrics.md
          } > report.md
        env:
          REPOSITORY: ${{ env.REPOSITORY }}
          START_DATE: ${{ env.START_DATE }}
          END_DATE: ${{ env.END_DATE }}

      # Final step: one issue with everything in it
      - name: Create issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Monthly community metrics report"
          token: ${{ secrets.GITHUB_TOKEN }}
          content-filepath: ./report.md
          # assignees: <YOUR_GITHUB_HANDLE_HERE>
